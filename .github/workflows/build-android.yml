name: Build Signed Android AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Prepare Web Directory
      run: |
        mkdir www
        cp index.html game.js style.css www/
        cp -r assets www/
        echo '{
          "appId": "brock_breaker_06.com.example.myapp",
          "appName": "ブロック崩し",
          "webDir": "www",
          "bundledWebRuntime": false
        }' > capacitor.config.json

    - name: Install Dependencies
      run: npm install

    - name: Initialize Capacitor Android
      run: |
        npx cap add android
        npx cap sync android

    - name: Update Target SDK and Version Code
      run: |
        if [ -f android/variables.gradle ]; then
          sed -i -E 's/targetSdkVersion([ =]+)[0-9]+/targetSdkVersion\135/' android/variables.gradle
          sed -i -E 's/compileSdkVersion([ =]+)[0-9]+/compileSdkVersion\135/' android/variables.gradle
        fi
        if [ -f android/app/build.gradle ]; then
          sed -i -E 's/targetSdk([ =]+)[0-9]+/targetSdk\135/' android/app/build.gradle
          sed -i -E 's/compileSdk([ =]+)[0-9]+/compileSdk\135/' android/app/build.gradle
          sed -i -E 's/targetSdkVersion([ =]+)[0-9]+/targetSdkVersion\135/' android/app/build.gradle
          sed -i -E 's/compileSdkVersion([ =]+)[0-9]+/compileSdkVersion\135/' android/app/build.gradle
          sed -i -E 's/versionCode [0-9]+/versionCode 7/' android/app/build.gradle
          sed -i 's/dependencies {/dependencies {\n    implementation "com.google.android.gms:play-services-ads:23.3.0"/' android/app/build.gradle
        fi

    - name: Add AdMob App ID to AndroidManifest
      run: |
        sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9929972384411537~8811544683" />\n</application>|' android/app/src/main/AndroidManifest.xml

    - name: Inject AdMob Banner into MainActivity
      run: |
        python3 << 'PYEOF'
import re, subprocess

result = subprocess.run(['find', 'android', '-name', 'MainActivity.java'], capture_output=True, text=True)
path = result.stdout.strip().split('\n')[0]
print(f"Found MainActivity: {path}")

with open(path, 'r') as f:
    content = f.read()

# Add imports before class declaration
admob_imports = (
    "import com.google.android.gms.ads.MobileAds;\n"
    "import com.google.android.gms.ads.AdRequest;\n"
    "import com.google.android.gms.ads.AdSize;\n"
    "import com.google.android.gms.ads.AdView;\n"
    "import android.widget.FrameLayout;\n"
    "import android.view.Gravity;\n"
)
content = re.sub(r'(?=public class MainActivity)', admob_imports, content)

# Add banner initialization after super.onCreate()
admob_code = (
    "\n        MobileAds.initialize(this, s -> {});\n"
    "        new android.os.Handler(android.os.Looper.getMainLooper()).postDelayed(() -> {\n"
    "            AdView adView = new AdView(this);\n"
    '            adView.setAdUnitId("ca-app-pub-3940256099942544/6300978111");\n'
    "            adView.setAdSize(AdSize.BANNER);\n"
    "            FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(\n"
    "                FrameLayout.LayoutParams.MATCH_PARENT,\n"
    "                FrameLayout.LayoutParams.WRAP_CONTENT);\n"
    "            lp.gravity = Gravity.BOTTOM;\n"
    "            addContentView(adView, lp);\n"
    "            adView.loadAd(new AdRequest.Builder().build());\n"
    "        }, 1000);\n"
)
content = re.sub(r'(super\.onCreate\(savedInstanceState\);)', r'\1' + admob_code, content)

with open(path, 'w') as f:
    f.write(content)
print("MainActivity updated successfully.")
PYEOF

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEY_STORE_BASE64 }}" | base64 --decode > android/app/my-release-key.jks

    - name: Build Signed AAB
      env:
        GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew bundleRelease \
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/my-release-key.jks \
          -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=my-key-alias \
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_ALIAS_PASSWORD }}

    - name: Upload Signed AAB
      uses: actions/upload-artifact@v4
      with:
        name: blockbreaker-signed-aab
        path: android/app/build/outputs/bundle/release/app-release.aab
