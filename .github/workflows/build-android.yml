name: Build Signed Android AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Prepare Web Directory
      run: |
        mkdir www
        cp index.html game.js style.css www/
        cp -r assets www/
        cp admob.js www/
        echo '{
          "appId": "brock_breaker_06.com.example.myapp",
          "appName": "ブロック崩し",
          "webDir": "www",
          "bundledWebRuntime": false,
          "plugins": {
            "AdMob": {
              "appId": "ca-app-pub-9929972384411537~8811544683"
            }
          }
        }' > capacitor.config.json

    - name: Install Dependencies
      run: |
        npm install
        npm install @capacitor-community/admob
        npm install -g esbuild
        npx esbuild admob.js --bundle --outfile=www/admob-bundle.js
        sed -i 's/<\/body>/<script src="admob-bundle.js"><\/script>\n<\/body>/' www/index.html

    - name: Initialize Capacitor Android
      run: |
        npx cap add android
        npx cap sync android

    - name: Update Target SDK and Version Code
      run: |
        if [ -f android/variables.gradle ]; then
          sed -i -E 's/targetSdkVersion([ =]+)[0-9]+/targetSdkVersion\135/' android/variables.gradle
          sed -i -E 's/compileSdkVersion([ =]+)[0-9]+/compileSdkVersion\135/' android/variables.gradle
        fi
        if [ -f android/app/build.gradle ]; then
          sed -i -E 's/targetSdk([ =]+)[0-9]+/targetSdk\135/' android/app/build.gradle
          sed -i -E 's/compileSdk([ =]+)[0-9]+/compileSdk\135/' android/app/build.gradle
          sed -i -E 's/targetSdkVersion([ =]+)[0-9]+/targetSdkVersion\135/' android/app/build.gradle
          sed -i -E 's/compileSdkVersion([ =]+)[0-9]+/compileSdkVersion\135/' android/app/build.gradle
          sed -i -E 's/versionCode [0-9]+/versionCode 5/' android/app/build.gradle
        fi

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEY_STORE_BASE64 }}" | base64 --decode > android/app/my-release-key.jks

    - name: Build Signed AAB
      run: |
        cd android
        chmod +x gradlew
        ./gradlew bundleRelease \
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/my-release-key.jks \
          -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=my-key-alias \
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_ALIAS_PASSWORD }}

    - name: Upload Signed AAB
      uses: actions/upload-artifact@v4
      with:
        name: blockbreaker-signed-aab
        path: android/app/build/outputs/bundle/release/app-release.aab
